appender.0.type = Console
appender.0.name = CONSOLE
appender.0.layout.type = PatternLayout
appender.0.layout.pattern = [%p] %m%n
# writes to System.out as it is now, so ConsoleLog's copy to logs/console gets these lines too
appender.0.follow = true

rootLogger.level = DEBUG
rootLogger.appenderRef.0.ref = CONSOLE
rootLogger.appenderRef.0.level = DEBUG

# ERROR hid Netty's own reports of failures it survived (pipeline exceptions, refused writes, discarded frames,
# decoder state after a bad handshake). Keep them at WARN; -Dlog.netty.level=DEBUG shows every channel event too.
logger.1.name = io.netty
logger.1.level = ${sys:log.netty.level:-WARN}
logger.1.appenderRef.0.ref = CONSOLE
logger.1.additivity = false

# HikariCP's per-connection DEBUG chatter is too noisy; keep INFO and above
logger.2.name = com.zaxxer.hikari
logger.2.level = INFO
logger.2.appenderRef.0.ref = CONSOLE
logger.2.additivity = false

# RESTEasy logs every JAXB provider it considers at DEBUG
logger.3.name = org.jboss.resteasy
logger.3.level = INFO
logger.3.appenderRef.0.ref = CONSOLE
logger.3.additivity = false