# Settings every v271 server starts with: the tested setup (connection handshake and the packet filter).
# server.properties overrides any of them. The filter (test.fieldGate) only lets through packets whose v271
# layout has been checked; test.fieldAllow* (server to client) and test.fieldInAllow* (client to server) list them.
# A packet left off the lists is dropped, so a feature that uses it does nothing instead of crashing the game.
# The allow lists add up: server.properties adds names to these lists instead of replacing them. To take a name
# out, put it on test.fieldDeny (server to client) or test.fieldInDeny (client to server).

test.skipEarlyPackets=false
test.noPing=false
# send cooldowns as GMS does (1390, ms) instead of 1646 (seconds)
test.cooltimeV271=false
test.channelEarlyDelayMs=2000
test.channelHelloDelayMs=300
test.channelHelloType=0
test.channelEarlyPackets=false
test.fieldGate=true
test.patternFile=resources/data/boss-patterns.bin
