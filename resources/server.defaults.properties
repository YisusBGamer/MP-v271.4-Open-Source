# Packed looks (party members, Kaling picker): v41 (the v271 layout) or v265 (the old 120-byte look)
test.packedLook=v41

# Where the launcher downloads the client hook (plus.dll): direct https link and its SHA-256.
client.hookUrl=https://pub-0a33c7d8787a416cad4545f9eca1c01a.r2.dev/plus.dll
client.hookSha256=f7b96f213017479ad66db4a871375b4fb11ba2bf0e5764ba1d9df5990f034925

# true only when nginx or Cloudflare Tunnel on this PC forwards the web API: requests from this PC then count as the
# address the proxy added to X-Forwarded-For (for the login limits). Off, every request counts as where it came from.
web.trustForwardedFor=false

# Database backups (mysqldump, zipped) into db.backup.dir under the server folder, or a full path. db.backup.hours: how
# often (0 = off); db.backup.keep: how many of each kind stay (timed, before a migration, by hand); beforeMigration: a
# backup before a start runs new sql/migration files. db.backup.mysqldump: the program or its folder, when it's not on
# PATH or in Program Files\MySQL. Restoring one: SETUP.md, "Backups".
db.backup.hours=6
db.backup.keep=28
db.backup.beforeMigration=true
db.backup.dir=backups/db
db.backup.mysqldump=

# New accounts (launcher and web API): web.registration=false closes sign-ups (for a wipe, say); web.accountsPerHour
# is how many one address may make per hour (0 = no limit). Names: 4-20 letters, numbers or _; email optional.
web.registration=true
web.accountsPerHour=3
